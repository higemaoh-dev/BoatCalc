<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageShare - ボート釣行費用精算カリキュレーター</title>
    <style>
        :root {
            --primary: #0b2f61;
            --primary-light: #164e96;
            --accent: #00d2ff;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border: #dcdde1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(11, 47, 97, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* メインコンテンツ */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        /* グループ化 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-with-unit {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-unit input {
            width: 100%;
            padding: 10px 36px 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            background-color: #fafbfc;
            outline: none;
            transition: all 0.2s;
        }

        .input-with-unit input:focus {
            border-color: var(--primary-light);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(22, 78, 150, 0.1);
        }

        .unit {
            position: absolute;
            right: 12px;
            font-size: 0.85rem;
            color: var(--text-sub);
            pointer-events: none;
        }

        /* クイックボタン群 */
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .q-btn {
            background-color: #f0f4f8;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 0;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .q-btn:hover {
            background-color: #e2e8f0;
        }

        .q-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 目的地ボタン */
        .dest-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 4px;
        }

        .dest-btn {
            background-color: #f0f4f8;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dest-btn:hover {
            border-color: var(--primary-light);
            background-color: #e8f1fc;
        }

        .dest-name {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .dest-dist {
            display: block;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        /* グリッドレイアウト */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* 結果表示カード */
        .result-card {
            background: linear-gradient(135deg, #0b2f61, #164e96);
            color: white;
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 6px 15px rgba(11, 47, 97, 0.2);
        }

        .result-header-label {
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .per-person-amount {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .per-person-amount span {
            font-size: 1.1rem;
            font-weight: normal;
        }

        .result-details {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            text-align: left;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-row.subtotal {
            font-weight: 700;
            font-size: 0.95rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            padding-top: 6px;
            margin-top: 2px;
        }

        .result-row span:last-child {
            font-weight: 600;
        }

        /* フッタークレジット */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: var(--text-sub);
            background-color: #fafbfc;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>VoyageShare</h1>
            <p>Yamaha Boat Cost Calculator</p>
        </header>

        <div class="content">
            <!-- 乗船人数セクション -->
            <div class="input-group">
                <label for="passengers">乗船人数 (オーナー含む)</label>
                <div class="input-with-unit">
                    <input type="number" id="passengers" value="2" min="1" max="6" inputmode="numeric">
                    <span class="unit">名</span>
                </div>
                <div class="quick-buttons" id="p-buttons">
                    <button type="button" class="q-btn" data-val="1">1名</button>
                    <button type="button" class="q-btn active" data-val="2">2名</button>
                    <button type="button" class="q-btn" data-val="3">3名</button>
                    <button type="button" class="q-btn" data-val="4">4名</button>
                    <button type="button" class="q-btn" data-val="5">5名</button>
                    <button type="button" class="q-btn" data-val="6">6名</button>
                </div>
            </div>

            <!-- 航行距離セクション -->
            <div class="input-group">
                <label for="distance">航行距離</label>
                <div class="input-with-unit">
                    <input type="number" id="distance" value="17.6" step="0.1" min="0" inputmode="decimal">
                    <span class="unit">nm</span>
                </div>
                <div class="dest-grid">
                    <div class="dest-btn" data-dist="17.6">
                        <span class="dest-name">瀬の海</span>
                        <span class="dest-dist">17.6 nm</span>
                    </div>
                    <div class="dest-btn" data-dist="44.0">
                        <span class="dest-name">三浦</span>
                        <span class="dest-dist">44.0 nm</span>
                    </div>
                    <div class="dest-btn" data-dist="48.4">
                        <span class="dest-name">初島</span>
                        <span class="dest-dist">48.4 nm</span>
                    </div>
                    <div class="dest-btn" data-dist="57.2">
                        <span class="dest-name">伊東</span>
                        <span class="dest-dist">57.2 nm</span>
                    </div>
                    <div class="dest-btn" data-dist="88.0">
                        <span class="dest-name">大島</span>
                        <span class="dest-dist">88.0 nm</span>
                    </div>
                    <div class="dest-btn" data-dist="110.0">
                        <span class="dest-name">下田</span>
                        <span class="dest-dist">110.0 nm</span>
                    </div>
                </div>
            </div>

            <!-- 燃料単価 -->
            <div class="input-group">
                <label for="fuelPrice">燃料単価</label>
                <div class="input-with-unit">
                    <input type="number" id="fuelPrice" value="150" step="1" min="0" inputmode="numeric">
                    <span class="unit">円/L</span>
                </div>
            </div>

            <!-- その他経費入力（2カラム：施設利用料・旅先係留代） -->
            <div class="grid-2">
                <div class="input-group">
                    <label for="facilityFee">施設利用料</label>
                    <div class="input-with-unit">
                        <input type="number" id="facilityFee" value="7700" step="100" min="0" inputmode="numeric">
                        <span class="unit">円</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="mooringFee">旅先係留代</label>
                    <div class="input-with-unit">
                        <input type="number" id="mooringFee" value="0" step="100" min="0" inputmode="numeric">
                        <span class="unit">円</span>
                    </div>
                </div>
            </div>

            <!-- その他経費入力（2カラム：エサ代・氷代） -->
            <div class="grid-2">
                <div class="input-group">
                    <label for="baitFee">エサ代</label>
                    <div class="input-with-unit">
                        <input type="number" id="baitFee" value="0" step="100" min="0" inputmode="numeric">
                        <span class="unit">円</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="iceFee">氷代</label>
                    <div class="input-with-unit">
                        <input type="number" id="iceFee" value="0" step="100" min="0" inputmode="numeric">
                        <span class="unit">円</span>
                    </div>
                </div>
            </div>

            <!-- 計算結果セクション -->
            <div class="result-card">
                <div>
                    <div class="result-header-label">1人あたり徴収額 (端数切り上げ)</div>
                    <div class="per-person-amount" id="resPerPerson">0<span> 円</span></div>
                </div>

                <div class="result-details">
                    <div class="result-row">
                        <span>燃料代</span>
                        <span id="resFuelCost">0 円</span>
                    </div>
                    <div class="result-row">
                        <span>施設・係留・消耗品費</span>
                        <span id="resOtherCost">0 円</span>
                    </div>
                    <div class="result-row subtotal">
                        <span>総経費合計</span>
                        <span id="resTotalCost">0 円</span>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            &copy; Pleasure Boat Cost Management Tool
        </footer>
    </div>

    <script>
        const passengersInput = document.getElementById('passengers');
        const distanceInput = document.getElementById('distance');
        const fuelPriceInput = document.getElementById('fuelPrice');
        const facilityFeeInput = document.getElementById('facilityFee');
        const mooringFeeInput = document.getElementById('mooringFee');
        const baitFeeInput = document.getElementById('baitFee');
        const iceFeeInput = document.getElementById('iceFee');

        const resPerPerson = document.getElementById('resPerPerson');
        const resFuelCost = document.getElementById('resFuelCost');
        const resOtherCost = document.getElementById('resOtherCost');
        const resTotalCost = document.getElementById('resTotalCost');

        const pButtons = document.querySelectorAll('#p-buttons .q-btn');
        const destButtons = document.querySelectorAll('.dest-btn');

        function getVal(element) {
            const val = parseFloat(element.value);
            return isNaN(val) ? 0 : val;
        }

        function formatYen(num) {
            return num.toLocaleString() + ' 円';
        }

        function calculateCost() {
            const passengers = Math.max(1, Math.min(6, getVal(passengersInput)));
            const distance = getVal(distanceInput);
            const fuelPrice = getVal(fuelPriceInput);
            const facilityFee = getVal(facilityFeeInput);
            const mooringFee = getVal(mooringFeeInput);
            const baitFee = getVal(baitFeeInput);
            const iceFee = getVal(iceFeeInput);

            // 燃費係数（L/nm）算出モデル
            let fuelEfficiency = 1.15; 
            if (passengers === 1) {
                fuelEfficiency = 1.0875; 
            } else if (passengers >= 3) {
                fuelEfficiency = 1.15 + (passengers - 2) * 0.0625;
            }

            const fuelCost = Math.round(distance * fuelEfficiency * fuelPrice);
            const otherCost = facilityFee + mooringFee + baitFee + iceFee;
            const totalCost = fuelCost + otherCost;
            const perPerson = Math.ceil(totalCost / passengers);

            resPerPerson.innerHTML = `${perPerson.toLocaleString()}<span> 円</span>`;
            resFuelCost.textContent = formatYen(fuelCost);
            resOtherCost.textContent = formatYen(otherCost);
            resTotalCost.textContent = formatYen(totalCost);

            pButtons.forEach(btn => {
                if (parseInt(btn.dataset.val) === passengers) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        const costInputs = [passengersInput, distanceInput, fuelPriceInput, facilityFeeInput, mooringFeeInput, baitFeeInput, iceFeeInput];
        costInputs.forEach(input => {
            input.addEventListener('input', calculateCost);
        });

        pButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                passengersInput.value = btn.dataset.val;
                calculateCost();
            });
        });

        destButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                distanceInput.value = btn.dataset.dist;
                calculateCost();
            });
        });

        // 初期計算実行
        calculateCost();
    </script>
</body>
</html>
